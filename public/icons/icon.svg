<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.6" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Center Dumbbell Icon + GP Logo -->
  <g fill="none" stroke="#10b981" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Barbell weights left -->
    <line x1="160" y1="210" x2="160" y2="302"/>
    <line x1="130" y1="230" x2="130" y2="282"/>
    
    <!-- Barbell weights right -->
    <line x1="352" y1="210" x2="352" y2="302"/>
    <line x1="382" y1="230" x2="382" y2="282"/>
    
    <!-- Center connecting bar -->
    <line x1="160" y1="256" x2="352" y2="256" stroke="#ffffff" stroke-width="16"/>
  </g>

  <!-- Typography: GymPro -->
  <text x="256" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">GYMPRO</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="6">FITNESS &amp; ACCESS</text>
</svg>
